[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/horizon/Dockerfile"
watchPatterns = ["apps/horizon/**", "contracts/stellar/**", "packages/stellar-sdk/**", "packages/core/**"]

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
region = "us-west1"

[[services]]
name = "horizon-indexer"
icon = "🔭"

[[services.domains]]
domain = "${RAILWAY_PUBLIC_DOMAIN}"

[variables]
NODE_ENV = "production"
PORT = "${{PORT}}"
NODE_OPTIONS = "--max-old-space-size=1024"